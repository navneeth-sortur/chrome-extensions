<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>AI Summary Assistant — Options</title>
    <style>
      body {
        font-family: system-ui, -apple-system, Roboto, Arial;
        padding: 18px;
        max-width: 720px;
      }
      label {
        display: block;
        margin-bottom: 6px;
        font-weight: 600;
      }
      input[type="text"],
      textarea {
        width: 100%;
        padding: 8px;
        border-radius: 6px;
        border: 1px solid #ddd;
        box-sizing: border-box;
      }
      button {
        margin-top: 10px;
        padding: 8px 12px;
        border-radius: 6px;
        background: #0066ff;
        color: #fff;
        border: none;
        cursor: pointer;
      }
      p.note {
        font-size: 13px;
        color: #555;
      }
    </style>
  </head>
  <body>
    <h2>AI Summary Assistant — Options</h2>

    <div>
      <label for="apiKey">OpenAI API Key</label>
      <input id="apiKey" type="text" placeholder="sk-..." />
      <p class="note">
        Your API key is stored locally in the extension storage. It is used to
        call OpenAI. Do not share your key.
      </p>
      <button id="saveBtn">Save</button>
      <button id="clearBtn" style="background: #999">Clear key</button>
      <div id="savedMsg" style="margin-top: 10px"></div>
    </div>

    <script src="options.js"></script>
  </body>
</html>
