<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>AI Summary Assistant</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>AI Summary Assistant</h1>
      </header>

      <div class="controls">
        <label for="length">Summary length</label>
        <select id="length">
          <option value="short">Short (1-2 lines)</option>
          <option value="medium" selected>Medium (3-6 sentences)</option>
          <option value="long">Long (detailed)</option>
        </select>

        <div class="buttons">
          <button id="summarizeBtn">Summarize</button>
          <button id="pointsBtn">Extract Key Points</button>
          <a id="optionsLink" href="#" title="Options">⚙️</a>
        </div>
      </div>

      <div id="status" class="status">Ready</div>

      <div id="result" class="result">
        <pre id="markdownOutput"></pre>
        <div class="result-actions">
          <button id="copyBtn">Copy</button>
          <button id="openInTabBtn">Open As New Tab</button>
        </div>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
