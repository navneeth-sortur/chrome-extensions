<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ReadEase Control Panel</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>📖 ReadEase</h1>
        <p class="subtitle">Reading Assistant</p>
      </header>

      <section class="control-section">
        <h2>🔊 Text-to-Speech</h2>
        <div class="control-group">
          <button id="speakSelected" class="btn btn-primary">
            Speak Selected Text
          </button>
          <button id="stopSpeaking" class="btn btn-secondary">Stop</button>
        </div>
        <div class="control-group">
          <label for="speechRate">Speed:</label>
          <input
            type="range"
            id="speechRate"
            min="0.5"
            max="2"
            step="0.1"
            value="1"
          />
          <span id="rateValue">1x</span>
        </div>
        <div class="control-group">
          <label for="speechPitch">Pitch:</label>
          <input
            type="range"
            id="speechPitch"
            min="0.5"
            max="2"
            step="0.1"
            value="1"
          />
          <span id="pitchValue">1x</span>
        </div>
      </section>

      <section class="control-section">
        <h2>🔤 Font Settings</h2>
        <div class="control-group">
          <label for="fontSize">Font Size:</label>
          <input
            type="range"
            id="fontSize"
            min="80"
            max="200"
            step="10"
            value="100"
          />
          <span id="fontSizeValue">100%</span>
        </div>
      </section>

      <section class="control-section">
        <h2>🎨 Contrast</h2>
        <div class="control-group">
          <label for="contrastMode">Mode:</label>
          <select id="contrastMode">
            <option value="normal">Normal</option>
            <option value="high">High Contrast</option>
            <option value="dark">Dark Mode</option>
            <option value="sepia">Sepia</option>
          </select>
        </div>
      </section>

      <section class="control-section">
        <h2>🎯 Focus Mode</h2>
        <div class="control-group">
          <label class="toggle-label">
            <input type="checkbox" id="focusMode" />
            <span class="toggle-text">Enable Focus Mode</span>
          </label>
        </div>
        <p class="help-text">Highlights paragraph on hover</p>
      </section>

      <footer>
        <button id="resetSettings" class="btn btn-link">
          Reset All Settings
        </button>
      </footer>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
